<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides | Araz.me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(0, 212, 255, 0.1);
        }

        .breadcrumb-item:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .breadcrumb-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            cursor: default;
        }

        .breadcrumb-separator {
            color: #555;
            font-size: 1.2rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        /* Card Styles */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        .card.folder .card-icon {
            color: #ffd93d;
        }

        .card.file .card-icon {
            color: #ff6b6b;
        }

        .card-name {
            font-size: 1rem;
            font-weight: 500;
            word-break: break-word;
            line-height: 1.4;
        }

        .card-type {
            font-size: 0.75rem;
            color: #888;
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Error State */
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #ff6b6b;
        }

        .error button {
            margin-top: 15px;
            padding: 10px 25px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .error button:hover {
            background: #ff5252;
        }

        /* Back Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        .stat-item span {
            color: #00d4ff;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .card {
                padding: 20px 15px;
            }

            .card-icon {
                font-size: 2.5rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.4s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📊 Slides | Araz.me</h1>
            <p>مجموعه اسلایدهای آموزشی</p>
        </header>

        <div id="breadcrumb" class="breadcrumb"></div>
        
        <div id="stats" class="stats"></div>

        <main id="content"></main>
    </div>

    <script>
        // ⚙️ تنظیمات - این قسمت را تغییر دهید
        const CONFIG = {
            // نام کاربری GitHub
            username: 'arazshah',
            // نام ریپازیتوری
            repo: 'presentations',
            // شاخه (معمولاً main یا master)
            branch: 'master',
            // آدرس سایت
            siteUrl: 'https://slides.araz.me'
        };

        // State
        let currentPath = '';
        let pathHistory = [];

        // DOM Elements
        const contentEl = document.getElementById('content');
        const breadcrumbEl = document.getElementById('breadcrumb');
        const statsEl = document.getElementById('stats');

        // GitHub API URL
        function getApiUrl(path = '') {
            const pathPart = path ? `/${path}` : '';
            return `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents${pathPart}?ref=${CONFIG.branch}`;
        }

        // نمایش Loading
        function showLoading() {
            contentEl.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>در حال بارگذاری...</p>
                </div>
            `;
        }

        // نمایش خطا
        function showError(message) {
            contentEl.innerHTML = `
                <div class="error">
                    <p>❌ ${message}</p>
                    <button onclick="loadContents(currentPath)">تلاش مجدد</button>
                </div>
            `;
        }

        // نمایش حالت خالی
        function showEmpty() {
            contentEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>این فولدر خالی است</p>
                </div>
            `;
        }

        // آپدیت Breadcrumb
        function updateBreadcrumb() {
            const parts = currentPath ? currentPath.split('/') : [];
            let html = `
                <div class="breadcrumb-item ${parts.length === 0 ? 'active' : ''}" onclick="navigateTo('')">
                    🏠 خانه
                </div>
            `;

            let pathSoFar = '';
            parts.forEach((part, index) => {
                pathSoFar += (pathSoFar ? '/' : '') + part;
                const isLast = index === parts.length - 1;
                const currentPathCopy = pathSoFar;
                
                html += `
                    <span class="breadcrumb-separator">›</span>
                    <div class="breadcrumb-item ${isLast ? 'active' : ''}" 
                         onclick="navigateTo('${currentPathCopy}')">
                        📁 ${part}
                    </div>
                `;
            });

            breadcrumbEl.innerHTML = html;
        }

        // آپدیت آمار
        function updateStats(items) {
            const folders = items.filter(i => i.type === 'dir').length;
            const files = items.filter(i => i.type === 'file' && i.name.endsWith('.html')).length;

            statsEl.innerHTML = `
                <div class="stat-item">
                    📁 <span>${folders}</span> فولدر
                </div>
                <div class="stat-item">
                    📄 <span>${files}</span> فایل HTML
                </div>
            `;
        }

        // بارگذاری محتویات
        async function loadContents(path = '') {
            showLoading();
            currentPath = path;
            updateBreadcrumb();

            try {
                const response = await fetch(getApiUrl(path));
                
                if (!response.ok) {
                    throw new Error('خطا در دریافت اطلاعات');
                }

                const data = await response.json();
                
                // فیلتر کردن: فقط فولدرها و فایل‌های HTML
                const items = data.filter(item => {
                    if (item.type === 'dir') return true;
                    if (item.type === 'file' && item.name.endsWith('.html') && item.name !== 'index.html') return true;
                    return false;
                });

                // مرتب‌سازی: اول فولدرها، بعد فایل‌ها
                items.sort((a, b) => {
                    if (a.type === 'dir' && b.type !== 'dir') return -1;
                    if (a.type !== 'dir' && b.type === 'dir') return 1;
                    return a.name.localeCompare(b.name);
                });

                updateStats(items);
                renderItems(items);

            } catch (error) {
                console.error('Error:', error);
                showError('خطا در بارگذاری محتویات. لطفاً دوباره تلاش کنید.');
            }
        }

        // رندر آیتم‌ها
        function renderItems(items) {
            if (items.length === 0) {
                showEmpty();
                return;
            }

            let html = '<div class="grid">';

            items.forEach(item => {
                const isFolder = item.type === 'dir';
                const icon = isFolder ? '📁' : '📄';
                const typeLabel = isFolder ? 'فولدر' : 'HTML';
                const displayName = item.name.replace('.html', '');

                html += `
                    <div class="card ${isFolder ? 'folder' : 'file'}" 
                         onclick="${isFolder ? `navigateTo('${item.path}')` : `openFile('${item.path}')`}">
                        <div class="card-icon">${icon}</div>
                        <div class="card-name">${displayName}</div>
                        <div class="card-type">${typeLabel}</div>
                    </div>
                `;
            });

            html += '</div>';
            contentEl.innerHTML = html;
        }

        // ناوبری به مسیر
        function navigateTo(path) {
            loadContents(path);
        }

        // باز کردن فایل HTML
        function openFile(path) {
            // استفاده از GitHub Pages URL
            const fileUrl = `${CONFIG.siteUrl}/${path}`;
            window.location.href = fileUrl;
        }

        // شروع برنامه
        document.addEventListener('DOMContentLoaded', () => {
            loadContents();
        });
    </script>
</body>
</html>
